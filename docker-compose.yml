services:
  database:
    image: postgres:17-alpine
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  engine:
    build:
      context: .docker
      dockerfile: engine/Dockerfile
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${ENGINE_PORT}:3000"
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}"
    volumes:
      - ./apps/engine:/app
    command: sh -c "npm install && npm run db:migrate && npm run dev"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  studio:
    build:
      context: .docker
      dockerfile: studio/Dockerfile
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${STUDIO_PORT}:5173"
    volumes:
      - ./apps/studio:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - engine

  worker:
    build:
      context: .docker
      dockerfile: worker/Dockerfile
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      ENGINE_URL: "http://engine:3000"
      WORKER_NAME: "${WORKER_NAME:-}"
    volumes:
      - ./apps/worker:/app
      - casper:/home/node/.casper
    command: sh -c "npm install && npm run dev"
    depends_on:
      engine:
        condition: service_healthy

  engine-test:
    build:
      context: .docker
      dockerfile: engine/Dockerfile
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}"
    volumes:
      - ./apps/engine:/app
    profiles:
      - test
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata:
  casper: