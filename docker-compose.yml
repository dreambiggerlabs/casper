services:
  database:
    image: postgres:17-alpine
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  engine:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${ENGINE_PORT}:3000"
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}"
    volumes:
      - ./apps/engine:/app
    command: sh -c "npm install && npm run db:migrate && npm run dev"
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  studio:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${STUDIO_PORT}:5173"
    volumes:
      - ./apps/studio:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - engine

  worker:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      ENGINE_URL: "http://engine:3000"
      WORKER_NAME: "${WORKER_NAME:-}"
    volumes:
      - ./apps/worker:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      engine:
        condition: service_healthy

volumes:
  pgdata: