name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package-lock.json
        id: check
        run: test -f package-lock.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Run engine checks
        if: steps.check.outputs.exists == 'true'
        run: npm run check --workspace=@casper/engine

      - name: Run studio checks
        if: steps.check.outputs.exists == 'true'
        run: npm run check --workspace=@casper/studio
